site_name: Acquisition Namespace
site_description: YAML-driven hierarchical path namespace builder for acquisition data pipelines.
site_url: https://murineshiftwork.github.io/acquisition-namespace
repo_url: https://github.com/murineshiftwork/acquisition-namespace
repo_name: murineshiftwork/acquisition-namespace
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: teal
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
