[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "acquisition-namespace"
dynamic = ["version"]
description = "YAML-driven hierarchical path namespace builder for acquisition data pipelines."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
    { name = "Lars B. Rollik", email = "lars@rollik.me" },
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/murineshiftwork/acquisition-namespace"
"Issue Tracker" = "https://github.com/murineshiftwork/acquisition-namespace/issues"

# ---------------------------------------------------------------------------
# Build

[tool.hatch.version]
source = "vcs"
fallback-version = "1.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/acquisition_namespace/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/acquisition_namespace"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml", "/VERSION"]

# ---------------------------------------------------------------------------
# Dependencies

[project.optional-dependencies]
dev = [
    "commitizen",
    "pytest>=8",
    "pytest-cov",
    "pre-commit",
    "mypy",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]

# ---------------------------------------------------------------------------
# Commitizen

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "commitizen"
version = "1.3.1"
version_files = ["VERSION"]
tag_format = "v$version"
update_changelog_on_bump = false

# ---------------------------------------------------------------------------
# Pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/acquisition_namespace --cov-report=term-missing --maxfail=5"

# ---------------------------------------------------------------------------
# Ruff

[tool.ruff]
line-length = 88
indent-width = 4
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "PTH",      # flake8-pathlib
    "TCH",      # flake8-type-checking
    "PYI",      # flake8-pyi
    "YTT",      # flake8-2020
    "N",        # pep8-naming
]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# ---------------------------------------------------------------------------
# Mypy

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
ignore_errors = true
