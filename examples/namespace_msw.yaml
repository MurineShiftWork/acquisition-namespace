version: "3.0"
description: "MSW acquisition namespace: subject > session > acquisition > file."
hierarchy:
  - subject
  - session
  - acquisition
  - file
optional_levels: []

validators:
  subject:
    pattern: "[\\w\\-]+"
    description: "animal identifier, alphanumeric with optional hyphens"
  datetime:
    pattern: "\\d{8}_\\d{6}(?:_\\d{6})?"
    description: "timestamp YYYYMMDD_HHmmss with optional microseconds suffix"
  task:
    pattern: "[\\w\\-]+"
    description: "task short name"

levels:
  subject:
    template: "{subject}"
    regex: "(?P<subject>${subject})"
    optional_fields: []
  session:
    template: "{subject}__{datetime}__{task}"
    regex: "(?P<subject>${subject})__(?P<datetime>${datetime})__(?P<task>${task})"
    optional_fields: []
  acquisition:
    template: "{subject}__{datetime}__{task}"
    regex: "(?P<subject>${subject})__(?P<datetime>${datetime})__(?P<task>${task})"
    optional_fields: []
  file:
    template: "{session}.msw.{artifact}"
    regex: "(?P<session>.+)\\.msw\\.(?P<artifact>.+)"
    optional_fields: []
