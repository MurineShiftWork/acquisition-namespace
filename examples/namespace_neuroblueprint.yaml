version: "1.0"
description: >
  NeuroBlueprint-compatible hierarchy (SWC/NIN standard).
  Follows sub-/ses- BIDS-style prefixes with typed datatype folders.
  Reference: https://neuroblueprint.neuroinformatics.dev/

hierarchy:
  - subject
  - session
  - datatype
  - file

optional_levels:
  - datatype

levels:
  subject:
    template: "sub-{subject_id}"
    regex: "sub-(?P<subject_id>[A-Za-z0-9]+)"
    optional_fields: []

  session:
    template: "ses-{session_id}"
    regex: "ses-(?P<session_id>[A-Za-z0-9]+)"
    optional_fields: []

  datatype:
    template: "{datatype}"
    regex: "(?P<datatype>behav|ephys|funcimg|anat|micr)"
    optional_fields: []

  file:
    template: "sub-{subject_id}_ses-{session_id}_task-{task_name}_{suffix}.{extension}"
    regex: "(?P<subject_id_file>sub-[A-Za-z0-9]+)_(?P<session_id_file>ses-[A-Za-z0-9]+)_task-(?P<task_name>[A-Za-z0-9]+)_(?P<suffix>[A-Za-z0-9]+)\\.(?P<extension>[A-Za-z0-9]+)"
    optional_fields: []
