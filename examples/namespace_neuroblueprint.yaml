version: "1.0"
description: >
  NeuroBlueprint-compatible hierarchy (SWC/NIN standard).
  Follows sub-/ses- BIDS-style prefixes with typed datatype folders.
  Reference: https://neuroblueprint.neuroinformatics.dev/

hierarchy:
  - subject
  - session
  - datatype
  - file

optional_levels:
  - datatype

validators:
  subject_id:
    pattern: "[A-Za-z0-9]+"
    description: "subject identifier, alphanumeric only (BIDS)"
  session_id:
    pattern: "[A-Za-z0-9]+"
    description: "session identifier, alphanumeric only (BIDS)"
  task_name:
    pattern: "[A-Za-z0-9]+"
    description: "task label"
  datatype:
    pattern: "behav|ephys|funcimg|anat|micr"
    description: "NeuroBlueprint data type"
  suffix:
    pattern: "[A-Za-z0-9]+"
    description: "file suffix (e.g. spikes, lfp, events)"
  extension:
    pattern: "[A-Za-z0-9]+"
    description: "file extension without leading dot (e.g. nwb, pkl)"

levels:
  subject:
    template: "sub-{subject_id}"
    regex: "sub-(?P<subject_id>${subject_id})"
    optional_fields: []

  session:
    template: "ses-{session_id}"
    regex: "ses-(?P<session_id>${session_id})"
    optional_fields: []

  datatype:
    template: "{datatype}"
    regex: "(?P<datatype>${datatype})"
    optional_fields: []

  file:
    template: "sub-{subject_id}_ses-{session_id}_task-{task_name}_{suffix}.{extension}"
    regex: "(?P<subject_id_file>sub-${subject_id})_(?P<session_id_file>ses-${session_id})_task-(?P<task_name>${task_name})_(?P<suffix>${suffix})\\.(?P<extension>${extension})"
    optional_fields: []
